image: ghcr.io/pnpm/pnpm:latest

definitions:
  caches:
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store

  steps:
    - step: &checks
        name: Lint, Types, Tests
        caches:
          - pnpm
        script:
          - pnpm runtime set node lts -g
          - pnpm install
          - pnpm lint
          - pnpm test:types
          - pnpm test
          - pnpm test:package

    - step: &node20
        name: Tests (Node 20)
        caches:
          - pnpm
        script:
          - pnpm runtime set node 20 -g
          - pnpm install
          - pnpm test

    - step: &node22
        name: Tests (Node 22)
        caches:
          - pnpm
        script:
          - pnpm runtime set node 22 -g
          - pnpm install
          - pnpm test

    - step: &node24
        name: Tests (Node 24)
        caches:
          - pnpm
        script:
          - pnpm runtime set node 24 -g
          - pnpm install
          - pnpm test

    - step: &node26
        name: Tests (Node 26)
        caches:
          - pnpm
        script:
          - pnpm runtime set node 26 -g
          - pnpm install
          - pnpm test

    - step: &cli-installer-pwsh
        name: CLI Installer Tests (PowerShell)
        image: mcr.microsoft.com/dotnet/sdk:10.0
        script:
          - |
            pwsh -NoProfile -Command '
              $ErrorActionPreference = "Stop"
              Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
              Invoke-Pester -Configuration @{ Run = @{ Path = "./test/cli/install.Tests.ps1"; Exit = $true } }
            '

pipelines:
  default:
    - step: *checks
    - step: *cli-installer-pwsh

  branches:
    main:
      - step: *checks
      - parallel:
          - step: *node20
          - step: *node22
          - step: *node24
          - step: *node26
          - step: *cli-installer-pwsh

  tags:
    'v*':
      - step: *checks
      - step: *cli-installer-pwsh
