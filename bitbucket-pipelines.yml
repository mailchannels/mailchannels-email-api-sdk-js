image: node:lts

definitions:
  caches:
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store

  steps:
    - step: &checks
        name: Lint, Types, Tests
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare pnpm@latest --activate
          - pnpm install
          - pnpm lint
          - pnpm test:types
          - pnpm test

    - step: &release
        name: Publish to npm
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare pnpm@latest --activate
          - pnpm config set registry https://registry.npmjs.org
          - pnpm config set '//registry.npmjs.org/:_authToken' "$NPM_TOKEN"
          - pnpm install
          - pnpm publish --access public --no-git-checks



pipelines:
  default:
    - step: *checks

  branches:
    main:
      - step: *checks

  pull-requests:
    main:
      - step: *checks

  tags:
    'v*':
      - step: *checks
      - step: *release
