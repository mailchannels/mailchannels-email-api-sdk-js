image: ghcr.io/pnpm/pnpm:latest

definitions:
  caches:
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store

  steps:
    - step: &checks
        name: Lint, Types, Tests
        caches:
          - pnpm
        script:
          - pnpm runtime set node lts -g
          - pnpm install
          - pnpm lint
          - pnpm test:types
          - pnpm test

    - step: &node20
        name: Tests (Node 20)
        caches:
          - pnpm
        script:
          - pnpm runtime set node 20 -g
          - pnpm install
          - pnpm test
    
    - step: &node22
        name: Tests (Node 22)
        caches:
          - pnpm
        script:
          - pnpm runtime set node 22 -g
          - pnpm install
          - pnpm test

    - step: &node24
        name: Tests (Node 24)
        caches:
          - pnpm
        script:
          - pnpm runtime set node 24 -g
          - pnpm install
          - pnpm test

    - step: &release
        name: Publish to npm
        caches:
          - pnpm
        script:
          - pnpm runtime set node lts -g
          - pnpm config set registry https://registry.npmjs.org
          - pnpm config set '//registry.npmjs.org/:_authToken' "$NPM_TOKEN"
          - pnpm install
          - pnpm publish --access public --no-git-checks

pipelines:
  default:
    - step: *checks

  branches:
    main:
      - step: *checks
      - parallel:
          - step: *node20
          - step: *node22
          - step: *node24

  tags:
    'v*':
      - step: *checks
      - step: *release
