name: release

on:
  workflow_run:
    workflows: [Sync public Bitbucket source]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'mailchannels/mailchannels-email-api-sdk-js' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          runtime: node@latest

      - name: Find latest upstream release
        id: release
        shell: bash
        run: |
          TAG=$(git tag --list 'v*' \
            --sort=-version:refname | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No release tags found"
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE=$(node -p "require('./package.json').name")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

          echo "Latest release: $TAG"

      - name: Check npm publication
        id: check
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PUBLISHED=$(pnpm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')

          if echo "$PUBLISHED" | jq -e \
            --arg version "$VERSION" \
            'if type == "array" then
               index($version) != null
             else
               . == $version
             end' > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION already published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION needs publishing"
          fi

      - name: Checkout latest release tag
        if: steps.check.outputs.published == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git checkout --detach "refs/tags/$TAG"

          PACKAGE_VERSION=$(node -p \
            "require('./package.json').version")

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag and package.json versions don't match"
            exit 1
          fi

      - name: Configure npm registry
        if: steps.check.outputs.published == 'false'
        run: pnpm config set registry https://registry.npmjs.org

      - name: Publish npm package
        if: steps.check.outputs.published == 'false'
        run: pnpm publish --access public --no-git-checks
